<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل الحساب</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            direction: rtl;
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #25D366;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .logo img {
            width: 40px;
            height: 40px;
        }
        .message {
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 16px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        .whatsapp-btn {
            background: #25D366;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            margin: 20px 0;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .whatsapp-btn:hover {
            background: #128C7E;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
        }
        .whatsapp-btn:active {
            transform: translateY(0);
        }
        .details {
            margin-top: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 14px;
            color: #666;
            text-align: right;
        }
        .instructions {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: right;
        }
        .instructions h4 {
            margin-top: 0;
            color: #1976d2;
        }
        .instructions ol {
            padding-right: 20px;
        }
        .instructions li {
            margin-bottom: 10px;
        }
        .back-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        .back-btn:hover {
            background: #5a6268;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #25D366;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="#25D366">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.76.982.998-3.675-.236-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.9 6.994c-.004 5.45-4.438 9.88-9.888 9.88m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.333.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.333 11.893-11.893 0-3.18-1.24-6.162-3.495-8.411"></path>
            </svg>
            تفعيل الحساب عبر واتساب
        </div>
        
        <div id="message" class="message loading">
            <div class="spinner"></div>
            <p>جارٍ تفعيل حسابك...</p>
        </div>
        
        <div id="details" class="details" style="display: none;"></div>
        
        <div id="whatsappButton" style="display: none;">
            <a id="whatsappLink" class="whatsapp-btn" target="_blank">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.76.982.998-3.675-.236-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.9 6.994c-.004 5.45-4.438 9.88-9.888 9.88m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.333.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.333 11.893-11.893 0-3.18-1.24-6.162-3.495-8.411"></path>
                </svg>
                فتح واتساب للتحقق
            </a>
        </div>
        
        <div id="instructions" class="instructions" style="display: none;">
            <h4>خطوات التحقق:</h4>
            <ol>
                <li>اضغط على زر "فتح واتساب" أعلاه</li>
                <li>سيفتح واتساب مع رسالة جاهزة</li>
                <li>أرسل الرسالة إلى نفس رقم هاتفك</li>
                <li>اضغط على الرابط في الرسالة</li>
                <li>عد إلى هذه الصفحة للتأكد من التفعيل</li>
            </ol>
        </div>
        
        <div id="successActions" style="display: none;">
            <button id="loginBtn" class="whatsapp-btn" onclick="window.location.href='/login.html'">
                تسجيل الدخول الآن
            </button>
            <button id="backBtn" class="back-btn" onclick="window.history.back()">
                العودة للصفحة السابقة
            </button>
        </div>
    </div>

    <script>
        async function verifyToken() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                document.getElementById('message').className = 'message error';
                document.getElementById('message').innerHTML = '<p>رابط التفعيل غير صالح</p>';
                return;
            }
            
            try {
                const response = await fetch('/api/users/verify_token.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ token: token })
                });
                
                const result = await response.json();
                
                const messageDiv = document.getElementById('message');
                const detailsDiv = document.getElementById('details');
                const whatsappButton = document.getElementById('whatsappButton');
                const instructionsDiv = document.getElementById('instructions');
                const successActions = document.getElementById('successActions');
                
                if (result.success) {
                    messageDiv.className = 'message success';
                    messageDiv.innerHTML = `
                        <p style="font-size: 24px; margin: 0;">✅</p>
                        <p style="font-size: 18px; font-weight: bold;">تم تفعيل حسابك بنجاح!</p>
                    `;
                    
                    detailsDiv.innerHTML = `
                        <p><strong>رقم المستخدم:</strong> ${result.user_id}</p>
                        <p><strong>حالة الجلسة:</strong> ${result.session_validated ? 'صحيحة' : 'غير متاحة'}</p>
                        <p>يمكنك الآن تسجيل الدخول باستخدام بريدك الإلكتروني وكلمة المرور</p>
                    `;
                    detailsDiv.style.display = 'block';
                    
                    // إظهار أزرار الإجراءات
                    successActions.style.display = 'block';
                    
                    // إخفاء زر واتساب والتعليمات
                    whatsappButton.style.display = 'none';
                    instructionsDiv.style.display = 'none';
                    
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.innerHTML = `
                        <p style="font-size: 24px; margin: 0;">❌</p>
                        <p style="font-size: 18px; font-weight: bold;">${result.message || 'فشل تفعيل الحساب'}</p>
                    `;
                    
                    if (result.details) {
                        detailsDiv.innerHTML = `<p><strong>التفاصيل:</strong> ${result.details}</p>`;
                        detailsDiv.style.display = 'block';
                    }
                    
                    // إذا كان هناك مشكلة في الجلسة، نعرض زر واتساب
                    if (result.message && (result.message.includes('session') || result.message.includes('جلسة'))) {
                        // إنشاء رابط واتساب للدعم
                        const whatsappUrl = `https://wa.me/?text=${encodeURIComponent('مرحباً، أحتاج مساعدة في تفعيل حسابي')}`;
                        document.getElementById('whatsappLink').href = whatsappUrl;
                        whatsappButton.style.display = 'block';
                        instructionsDiv.style.display = 'block';
                    }
                }
            } catch (error) {
                document.getElementById('message').className = 'message error';
                document.getElementById('message').innerHTML = `
                    <p style="font-size: 24px; margin: 0;">⚠️</p>
                    <p style="font-size: 18px; font-weight: bold;">حدث خطأ أثناء التفعيل</p>
                    <p style="font-size: 14px;">يرجى المحاولة مرة أخرى أو التواصل مع الدعم</p>
                `;
                
                // عرض رابط واتساب للدعم في حالة الخطأ
                const whatsappUrl = `https://wa.me/?text=${encodeURIComponent('مرحباً، أحتاج مساعدة في تفعيل حسابي. حدث خطأ: ' + error.message)}`;
                document.getElementById('whatsappLink').href = whatsappUrl;
                document.getElementById('whatsappButton').style.display = 'block';
                document.getElementById('instructions').style.display = 'block';
                
                console.error('Verification error:', error);
            }
        }
        
        // Auto-verify on page load
        document.addEventListener('DOMContentLoaded', verifyToken);
        
        // زر العودة
        document.getElementById('backBtn')?.addEventListener('click', () => {
            window.history.back();
        });
    </script>
</body>
</html>
