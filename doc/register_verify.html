<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل وإرسال رمز عبر واتساب والتحقق</title>
<style>body{font-family:Arial,Helvetica,sans-serif;direction:rtl;padding:18px}label{display:block;margin-top:10px}input{width:100%;padding:8px;margin-top:6px}button{padding:10px;background:#0b6f00;color:#fff;border:0;border-radius:6px;margin-top:10px}pre{background:#f7f7f7;padding:10px;border-radius:6px}</style>
</head>
<body>
  <h3>تسجيل وإرسال رمز عبر واتساب</h3>
  <div id="reg">
    <label>الاسم (اختياري)<input id="username" /></label>
    <label>رقم الهاتف (مثال +971559740334)<input id="phone" /></label>
    <button id="send">سجّل وأرسل رمز عبر واتساب</button>
    <pre id="out"></pre>
  </div>

  <div id="ver" style="display:none">
    <h4>التحقق</h4>
    <label>أدخل الكود المرسل<input id="code" /></label>
    <button id="verify">تحقق</button>
    <pre id="vout"></pre>
  </div>

<script>
const out=document.getElementById('out'), vout=document.getElementById('vout');
document.getElementById('send').addEventListener('click', async ()=>{
  out.textContent='جارٍ الإرسال...';
  const phone=document.getElementById('phone').value.trim();
  const username=document.getElementById('username').value.trim();
  if(!phone){ out.textContent='أدخل رقم الهاتف'; return; }
  try{
    const res=await fetch('/register_and_send.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,username})});
    const j=await res.json();
    out.textContent=JSON.stringify(j,null,2);
    if(j.ok){ document.getElementById('ver').style.display='block'; document.getElementById('reg').style.display='none'; document.getElementById('code').value = j.code || ''; }
  }catch(e){ out.textContent='خطأ: '+e.message; }
});

document.getElementById('verify').addEventListener('click', async ()=>{
  vout.textContent='جارٍ التحقق...';
  const code=document.getElementById('code').value.trim();
  const phone=document.getElementById('phone').value.trim();
  if(!code){ vout.textContent='أدخل الكود'; return; }
  try{
    const form=new URLSearchParams(); form.append('code', code); form.append('phone', phone);
    const res=await fetch('/api/users/verify_code.php',{method:'POST',body:form});
    const j=await res.json();
    vout.textContent=JSON.stringify(j,null,2);
    if(j.success){ vout.textContent='تم التحقق وتفعيل المستخدم.'; }
  }catch(e){ vout.textContent='خطأ: '+e.message; }
});
</script>
</body>
</html>
